services:
  # db:
  #   image: postgres:15
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - app_network
  #     - pg_network

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DEBUG: ${DEBUG}
      PYTHONUNBUFFERED: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
    env_file:
      - .env
    volumes:
      - .:/app:Z
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - app_network
      - postgres_global_network 

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
    networks:
      - app_network

  frontend-public:
    build:
      context: ./frontend-public
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./frontend-public:/app:Z
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
    networks:
      - app_network

networks:
  app_network:
  postgres_global_network:
    external: true  # Usa la red externa existente
